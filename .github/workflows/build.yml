name: OrangeFox - Build (dizi)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget unzip zip python3 python-is-python3 repo openjdk-21-jdk build-essential libncurses-dev libssl-dev libxml2-dev libzstd-dev lz4 ccache
          git config --global user.name "builder"
          git config --global user.email "builder@actions.local"

      - name: Sync OrangeFox fox_16.0 sources
        run: |
          sudo mkdir -p /mnt/fox
          sudo chown -R $USER:$USER /mnt/fox
          cd /mnt/fox
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          mkdir -p .repo/local_manifests
          curl -o .repo/local_manifests/dizi.xml \
            https://raw.githubusercontent.com/${{ github.repository }}/fox_16.0/dizi.xml
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)

      - name: Build recovery
        run: |
          cd /mnt/fox
          export FOX_BUILD_DEVICE=dizi
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          echo "=== Disk before swap ==="
          df -h /
          AVAILABLE=$(df -B1M --output=avail /mnt | tail -n1)
          SWAP_SIZE=$(( AVAILABLE - 20000 ))
          if [ "$SWAP_SIZE" -gt 32000 ]; then SWAP_SIZE=32000; fi
          if [ "$SWAP_SIZE" -lt 16000 ]; then SWAP_SIZE=16000; fi
          echo "Creating swap of ${SWAP_SIZE} MB"
          sudo fallocate -l ${SWAP_SIZE}M /mnt/swapfile2
          sudo chmod 600 /mnt/swapfile2
          sudo mkswap /mnt/swapfile2
          sudo swapon /mnt/swapfile2
          sudo sysctl vm.swappiness=100
          echo "=== Memory after swap ==="
          free -h
          ( while true; do echo "[MEM] $(free -m | awk '/Mem:/{printf "RAM used/avail: %s/%s MB; ", $3, $7} /Swap:/{printf "Swap used/total: %s/%s MB", $3, $2}')"; sleep 30; done ) &
          source build/envsetup.sh
          source device/xiaomi/dizi/vendorsetup.sh
          lunch twrp_dizi-bp2a-eng
          mka adbd recoveryimage -j2 | tee build.log

      - name: Check output
        run: ls -lh /mnt/fox/out/target/product/dizi/ || true

      - name: Upload recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-dizi
          path: |
            /mnt/fox/out/target/product/dizi/recovery.img
            /mnt/fox/out/target/product/dizi/*.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /mnt/fox/build.log
